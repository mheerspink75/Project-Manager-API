# Alembic configuration for the Project Manager API.
#
# The database URL is resolved at runtime by alembic/env.py:
#   1. sqlalchemy.url from this file (left empty on purpose),
#   2. the DATABASE_URL environment variable,
#   3. a local SQLite fallback (development/tests only).
# Deliberately no secrets live in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

# Logging configuration; apply to both the CLI and script.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
